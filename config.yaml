embedding_model: mxbai-embed-large
embedding_dim: 1024
vector_db_provider: "chroma"
vector_db_persist_dir: "data/chroma"
vector_db_collection: "easy_local_rag"
vector_db_batch_size: 64
vector_db_timeout_s: 30
ollama_model: "lfm2.5-thinking:1.2b"
top_k: 7
system_message: "You are a helpful assistant that is an expert at extracting the most useful information from a given text"
context_token_budget: 1500
context_overlap: 20
multi_pass: false
model_timeout: 120

# Model/chat rewrite & response token limits
rewrite_max_tokens: 200
rewrite_temperature: 0.1
chat_max_tokens: 4000

# Streaming + continuation defaults
enable_streaming: true
enable_thinking_summary: true
per_call_max_tokens: 4000
max_continuations: 2
flush_interval_ms: 250
provider_timeout_s: 300
continuation_instruction: "Continue exactly where you left off. Do not repeat prior text."

# Finalization options for reasoning drafts
auto_finalize_thoughts: false
finalize_max_tokens: 400
finalize_temperature: 0.0

# Chunking defaults (token counts)
chunk_max_tokens: 200
chunk_overlap_tokens: 20

# Ingestion safety + parser limits
ingest_max_bytes: 8388608
ingest_max_rows: 2000
ingest_max_objects: 2000
ingest_max_pages: 200
ingest_max_slides: 300
ingest_max_sheets: 50
ingest_timeout_s: 30
ingest_zip_max_entries: 10000
ingest_zip_max_uncompressed_bytes: 134217728
ingest_enable_parquet: true
ingest_enable_legacy_office: true
ingest_state_path: "data/ingest_state.json"
doc_registry_path: "data/doc_registry.json"

# Retrieval tuning defaults
retrieval_dense_top: 100
retrieval_bm25_top: 100
retrieval_rrf_k: 60

# BM25 parameters
bm25_k1: 1.5
bm25_b: 0.75

# Reranker weights (can override keys: dense, bm25, overlap, length)
reranker_weights:
  dense: 1.0
  bm25: 1.0
  overlap: 0.8
  length: 0.1

# Embedding fallback length when provider rejects long inputs
embedding_fallback_length: 512

ollama_api:
  base_url: "http://localhost:11434/v1"
  api_key: "lfm2.5-thinking:1.2b"
