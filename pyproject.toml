[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "data",
  "logs",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
files = ["app", "cmd", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false

[tool.fastapi_integration]
required_dependencies = ["fastapi", "uvicorn", "httpx", "python-multipart"]
